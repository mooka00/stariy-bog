<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2</title>
    <style>
        
        body{
            margin: 0;
            background: crimson;
            color:darkolivegreen;
            font-family: Times, serif;

        }
        header{
           background: cyan; 
           color: bisque;
           padding: 80px 40px;
           display: flex;
           justify-content: space-between;
        }
        .logo{
            font-size: 16px;
            font-weight: 900;
        }
        nav{
            display: flex;
            gap: 20px;
            flex-direction: row;
        }
        nav a {
            color: rgb(30, 117, 6);
            text-decoration: underline plum;
        }
        .card {
            background: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            
            align-items: center;
        }
        .avatar {
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background-image: url(png/pudge.webp);
            background-position: center;
            margin-bottom: 10px;
        }
        .card h3 {
            margin: 0 0 10px;
        }

        .card p {
            color: #b87bfa;
        }
        footer {
            margin-top: 40px;
            padding: 30px 40px;
            background: #222;
            color: white;
            display: flex;
            justify-content: space-between;
        }

        .footer-links {
            display: flex;
            gap: 50px;
            flex-direction: row;
        }

        footer a {
            color: #ebf0f1;
            text-decoration: none;
        }

    </style>
</head>

<body>
<header>
    <div class="logo">
        DreamPuges
    </div>
    <nav>
        <a href="#">Hook Meat</a>
        <a href="#">Rot</a>
        <a href="#">Meat Shield</a>
        <a href="#">Dismember</a>
    </nav>

</header>
<main>


    <div class="team">
        <div class="card">
            <div class="avatar"></div>

            <h1>Pudge</h1>

            <p>
                Butcher
            </p>
        </div>
    </div>

</main>
<footer>

    <div>
        DreamPuges © 2003
    </div>

    <div class="footer-links">
        <a href="#">Crystal Maiden</a>
        <a href="#">Lina</a>
        <a href="#">Queen of Pain</a>
    </div>

</footer>
</body>
</html>
